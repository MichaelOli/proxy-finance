[project]
name = "proxy-finance"
version = "1.0.0"
description = "API de parsing estruturado de extratos financeiros em PDF. Identifica o banco automaticamente e retorna JSON estruturado."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "pdfplumber>=0.11",
    "pdf2image>=1.17",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "python-multipart>=0.0.9",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.14.0",
]
